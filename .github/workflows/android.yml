# Builds the Android version (android/) into SplitScreenMod-android-arm64.zip / .levipack for LeviLauncher on Android.
name: Android

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the android-latest pre-release
    steps:
      - uses: actions/checkout@v7

      # The runner already has the Android SDK; android-actions/setup-android failed on its own sdkmanager install.
      # NDK 28.2 is installed if missing; the runner's newest NDK is the fallback.
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          if [ ! -d "$NDK" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null || true
          fi
          if [ ! -d "$NDK" ]; then NDK="$ANDROID_NDK_LATEST_HOME"; fi
          echo "Using NDK $NDK"
          echo "NDK=$NDK" >> "$GITHUB_ENV"

      - run: |
          cmake -S android -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android --target levi_package

      # The mod's resource pack (menu look, black "Choose your player" screen, texts in every language), imported
      # into Minecraft once. Its pause menu button is for Windows only and is left out.
      - run: |
          cd resource_packs/SplitScreenUI
          zip -qr ../../build-android/SplitScreenUI.mcpack . -x 'ui/pause_screen.json'
          mkdir -p ../../build-android/package && cp ../../build-android/SplitScreenUI.mcpack ../../build-android/package/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-android-arm64
          path: build-android/package/

      # The newest Android build is always at the same link, so it can be downloaded straight on the phone:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/SplitScreenMod-android-arm64.zip
      - if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest build-android/SplitScreenMod-android-arm64.zip build-android/SplitScreenUI.mcpack \
            --prerelease --target "$GITHUB_SHA" --title "Android (experimental, newest build)" \
            --notes "Newest experimental Android build from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Add it in LeviLauncher for Android with Mods > Add Mod, and import SplitScreenUI.mcpack into Minecraft (Settings > Global Resources) for the menus."
