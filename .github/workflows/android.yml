# Builds the Android version (android/) into SplitScreenMod-android-arm64.zip / .levipack for LeviLauncher on Android.
name: Android

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The runner already has the Android SDK; android-actions/setup-android failed on its own sdkmanager install.
      # NDK 28.2 is installed if missing; the runner's newest NDK is the fallback.
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          if [ ! -d "$NDK" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null || true
          fi
          if [ ! -d "$NDK" ]; then NDK="$ANDROID_NDK_LATEST_HOME"; fi
          echo "Using NDK $NDK"
          echo "NDK=$NDK" >> "$GITHUB_ENV"

      - run: |
          cmake -S android -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android --target levi_package

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-android-arm64
          path: build-android/package/
