on:
  pull_request:
  push:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target_type:
          - client
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          actions-cache-folder: .xmake-cache
      
      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-packages-levilamina-26.60
          restore-keys: |
            xmake-

      # The runner's preinstalled LLVM is used; installing LLVM 22 every run took over a minute.
      - run: clang-cl --version

      - run: |
          xmake repo -u

      # newest LeviLamina 26.60.x first; if it does not build, the last version known to work
      - run: |
          xmake f -a x64 -m release -p windows -v --target_type=${{ matrix.target_type }} -y
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Newest LeviLamina failed to build, using 26.60.5"
            "LEVILAMINA_VERSION=26.60.5" >> $env:GITHUB_ENV
            $env:LEVILAMINA_VERSION = "26.60.5"
            xmake f -a x64 -m release -p windows -v --target_type=${{ matrix.target_type }} -y
            exit $LASTEXITCODE
          }

      - run: |
          xmake -v -y

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-windows-x64
          path: |
            bin/
